<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#f7f6f2" />
  <title>CB-CAP · Lewis County planning table · SozoRock Tech Inc.</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet" />
  <link href="./css/app.css" rel="stylesheet" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <a class="skip" href="#stage">Skip to planning table</a>
  <div class="app">
    <header class="top">
      <div class="brand">
        <strong>CB-CAP</strong>
        <span>SOZOROCK TECH INC.</span>
      </div>
      <nav class="workflow" aria-label="Planning workflow">
        <button data-view="see">See</button>
        <button data-view="compare">Compare</button>
        <button data-view="plan">Plan</button>
        <button data-view="resource">Resource</button>
        <button data-view="track">Track</button>
      </nav>
      <div class="right-tools">
        <div class="seg" role="group" aria-label="Surface">
          <button data-surface="public">Public</button>
          <button data-surface="institutional">Institutional</button>
        </div>
      </div>
    </header>
    <div class="banner">
      <span id="banner-text"></span>
      <span class="hide-phone">Drag to orbit · pinch to zoom · tap a ZIP · arrows change lens</span>
    </div>
    <div class="main">
      <aside class="rail" id="rail"></aside>
      <section class="stage" id="stage">
        <canvas id="view3d"></canvas>
        <div class="map-label" id="map-label-a">Lewis County · 3D planning table</div>
        <div class="legend" id="legend" aria-label="How to read the table"></div>
        <div class="feat-dock" id="feat-dock" aria-label="Product features"></div>
        <div class="stamps" id="stamps" aria-label="Small multiples of twelve barrier dimensions"></div>
        <div class="tour" id="tour">
          <p class="kicker" id="tour-kicker">How to read this</p>
          <h2 id="tour-title">The land is terrain.</h2>
          <p id="tour-body">Hills are not a barrier score. Color is the evidence state of the dimension you opened.</p>
          <div class="tour-nav">
            <button class="ghost" id="tour-skip" type="button">Enter product</button>
            <button class="primary" id="tour-next" type="button">Next</button>
          </div>
          <p class="tour-step" id="tour-step">1 / 8</p>
        </div>
        <div class="map-tools">
          <button class="flat-btn" id="btn-reset">Reset camera</button>
          <button class="flat-btn" id="btn-scenario">Planning scenario</button>
          <button class="flat-btn" id="btn-tour">Replay tour</button>
          <a class="flat-btn" href="./fallback.html">2D table</a>
        </div>
        <button class="sheet-handle hide-desk" id="sheet-toggle" type="button">ZIP lens</button>
      </section>
      <aside class="inspector" id="inspector"></aside>
    </div>
  </div>
  <script src="./data/seed.js"></script>
  <script src="./data/seed-lenses.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
